; NEXUS Tier 5A — ESP32 temperature sensor firmware
; PlatformIO project file. See README.md for build/flash instructions.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Pinned exact library versions (never a floating/latest range) so a build
; today reproduces identically in the future.
lib_deps =
    256dpi/MQTT @ 2.5.2
    bblanchon/ArduinoJson @ 7.2.1
    adafruit/DHT sensor library @ 1.4.6
    adafruit/Adafruit Unified Sensor @ 1.1.14
    adafruit/Adafruit BME280 Library @ 2.2.4


build_flags =
    -D CORE_DEBUG_LEVEL=3
