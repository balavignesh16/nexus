# Test default: the outbox dispatcher's SCHEDULED loops are off, as the rest of the suite does not use the outbox and finished
# classes' cached application contexts would otherwise keep polling their stopped databases (the same reason the rule and twin
# scanners are set to 24 h in TypedTriggerSupport). Tests that exercise the dispatcher set
# nexus.command.outbox.dispatcher-enabled=true explicitly. This is a TEST setting: the production default is true, and startup
# fails if it is false while nexus.command.outbox.enabled is true.
nexus.command.outbox.dispatcher-enabled=false

# Test default (P4.4): the command lifecycle scanners (persisted ACK timeout, legacy reconciliation) have their SCHEDULED loops off for the same
# reason as the dispatcher above. Tests that exercise them call scan()/reconcile() directly or set nexus.command.lifecycle-scanners-enabled=true.
# This is a TEST setting: the production default is true.
nexus.command.lifecycle-scanners-enabled=false
