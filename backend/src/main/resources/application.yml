spring:
  application:
    name: nexus
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexus_db}
    username: ${DB_USER:nexus_user}
    password: ${DB_PASSWORD:nexus_dev_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

mqtt:
  broker:
    url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
  client:
    id: ${MQTT_CLIENT_ID:nexus-backend-sub}
  topic:
    telemetry: nexus/devices/+/telemetry
    status: nexus/devices/+/status
    command-ack: nexus/devices/+/commands/ack

nexus:
  twin:
    maximum-future-skew: ${TWIN_MAXIMUM_FUTURE_SKEW:PT5M}
    default-freshness-threshold: ${TWIN_DEFAULT_FRESHNESS_THRESHOLD:PT120S}
  retention:
    telemetry-days: 30
    pipeline-days: 7
    events-days: 90
    actions-days: 90
  command:
    outbox:
      # Phase 4 reliable command delivery. OFF by default (decision D7); P4.1 only reads and validates these values.
      enabled: ${NEXUS_COMMAND_OUTBOX_ENABLED:false}
      delivery-window: ${NEXUS_COMMAND_OUTBOX_DELIVERY_WINDOW:PT15S}   # whole seconds, 2s..20s (firmware freshness 30s minus 10s margin)
      max-attempts: ${NEXUS_COMMAND_OUTBOX_MAX_ATTEMPTS:3}              # 1..5
      attempt-timeout: ${NEXUS_COMMAND_OUTBOX_ATTEMPT_TIMEOUT:PT3S}
      initial-backoff: ${NEXUS_COMMAND_OUTBOX_INITIAL_BACKOFF:PT0.5S}
      backoff-multiplier: ${NEXUS_COMMAND_OUTBOX_BACKOFF_MULTIPLIER:2.0}
      max-backoff: ${NEXUS_COMMAND_OUTBOX_MAX_BACKOFF:PT4S}
      jitter-fraction: ${NEXUS_COMMAND_OUTBOX_JITTER_FRACTION:0.2}
      lease-duration: ${NEXUS_COMMAND_OUTBOX_LEASE_DURATION:PT6S}       # at least attempt-timeout + 2s
      claim-batch-size: ${NEXUS_COMMAND_OUTBOX_CLAIM_BATCH_SIZE:10}
      poll-interval: ${NEXUS_COMMAND_OUTBOX_POLL_INTERVAL:PT0.25S}
      expiry-scan-interval: ${NEXUS_COMMAND_OUTBOX_EXPIRY_SCAN_INTERVAL:PT1S}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-ms: ${AI_TIMEOUT_MS:8000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    api-key: ${AI_API_KEY:}
    rate-limit:
      requests-per-minute: ${AI_RATE_LIMIT_REQUESTS_PER_MINUTE:5}
      burst: ${AI_RATE_LIMIT_BURST:5}
      concurrency-limit: ${AI_RATE_LIMIT_CONCURRENCY:4}
