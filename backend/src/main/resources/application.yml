spring:
  application:
    name: nexus
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexus_db}
    username: ${DB_USER:nexus_user}
    password: ${DB_PASSWORD:nexus_dev_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

mqtt:
  broker:
    url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
  client:
    id: nexus-backend-sub
  topic:
    telemetry: nexus/devices/+/telemetry

nexus:
  retention:
    telemetry-days: 30
    pipeline-days: 7
    events-days: 90
    actions-days: 90
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-ms: ${AI_TIMEOUT_MS:8000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    api-key: ${AI_API_KEY:}
