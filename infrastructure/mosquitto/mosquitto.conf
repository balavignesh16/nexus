listener 1883 0.0.0.0
# WARNING: allow_anonymous true is approved ONLY for trusted local development and simulation.
# Before real ESP32 hardware communicates outside a trusted local development environment, MQTT authentication must be enabled.
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
