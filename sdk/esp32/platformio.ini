; PlatformIO project for developing and testing the NEXUS ESP32 library itself (the library consumers add it through lib_deps or
; the Arduino library manager; they do not use this file).
;
; native: builds the library and the host tests on the development machine (no hardware). It was executed once with PlatformIO
; Core 6.2.0 and platform native 1.2.1 (host g++ 4.7.2): SUCCESS, and the program passed all its checks. The repository's automated
; tests use test/build_host.py with plain g++, so they do not need PlatformIO.
; samples: builds a sample sketch for the ESP32 with the framework and the MQTT library the committed firmware pins. This
; environment has NOT been executed in this repository (no ESP32 platform or toolchain was installed) and no image was flashed.

[platformio]
default_envs = native

[env:native]
platform = native
build_flags = -std=gnu++11 -Wall -Wextra -DNEXUS_HOST_TEST=1 -Isrc -Itest/host
build_src_filter = +<*> +<../test/host/test_main.cpp>
lib_ldf_mode = off
; the program expects the repository root as its first argument:  <build dir>/native/program ../..

[env:samples]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    256dpi/MQTT @ 2.5.2
build_flags = -std=gnu++11 -DNEXUS_SAMPLE=1
lib_extra_dirs = ..
