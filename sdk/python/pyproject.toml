[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus_contract"
version = "1.0.0"
description = "NEXUS device wire contract: the standalone validator (nexus_contract) and the device SDK (nexus_device_sdk)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26,<5"
]

[tool.setuptools.packages.find]
include = ["nexus_contract*", "nexus_device_sdk*"]

# The schemas are NOT packaged: contracts/ at the repository root is the single authority and is located at run time
# (override with the NEXUS_CONTRACTS_DIR environment variable). Tested with the pins in requirements.txt.
