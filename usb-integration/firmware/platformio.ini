[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
lib_deps = bblanchon/ArduinoJson@7.2.1

[env:esp1]
build_src_filter = -<*> +<esp1.cpp>
upload_port = COM5

[env:esp2]
build_src_filter = -<*> +<esp2.cpp>
upload_port = COM8
build_flags = -D ESP2_WIRING_VERIFIED=1 -D ESP2_RGB_ACTIVE_HIGH=1 -D ESP2_RELAY_ACTIVE_HIGH=1

[env:esp3]
build_src_filter = -<*> +<esp3.cpp>
upload_port = COM10
build_flags = -D ESP3_POWER_VERIFIED=1
